[workspace]
members = ["crates/cue-compiler", "crates/cue-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/siriuslatte/cue"

[workspace.dependencies]
cue-compiler = { path = "crates/cue-compiler" }
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = true
