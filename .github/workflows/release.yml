name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_run' && 'dev' || github.ref }}
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      prerelease: ${{ steps.source.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: source
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$sha" origin/main
          if [ "$EVENT" = workflow_run ]; then
            tag=dev
            prerelease=true
          else
            version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
            test "$REF_NAME" = "v$version"
            tag=$REF_NAME
            prerelease=false
            if [[ "$version" == *-* ]]; then prerelease=true; fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  package:
    needs: [source, checks]
    if: >-
      always() && !cancelled() && needs.source.result == 'success' &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64, binary: cue }
          - { os: macos-latest, target: macos-aarch64, binary: cue }
          - { os: macos-15-intel, target: macos-x86_64, binary: cue }
          - { os: windows-latest, target: windows-x86_64, binary: cue.exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - run: cargo build --locked --release -p cue-cli
      - run: ./target/release/${{ matrix.binary }} --version
        shell: bash
      - run: python scripts/package.py --binary target/release/${{ matrix.binary }} --target ${{ matrix.target }}
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        if: runner.os == 'Linux'
        with:
          version: v1.2.0
      - if: runner.os == 'Linux'
        run: |
          python scripts/package.py --binary target/release/cue --target linux-x86_64 --runtime
          rojo build runtime/default.project.json -o dist/Cue.rbxm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cue-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [source, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cue-*
          path: dist
          merge-multiple: true
      - run: sha256sum dist/* | sed 's|dist/||' > dist/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          TAG: ${{ needs.source.outputs.tag }}
          PRERELEASE: ${{ needs.source.outputs.prerelease }}
        run: |
          if [ "$TAG" = dev ]; then
            printf 'Development build from `%s`.\n' "$SOURCE_SHA" > notes.md
            if gh release view dev > /dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/dev" -f sha="$SOURCE_SHA" -F force=true > /dev/null
              gh release edit dev --title "Development build" --notes-file notes.md --prerelease --latest=false
              gh release upload dev dist/* --clobber
            else
              gh release create dev dist/* --target "$SOURCE_SHA" --title "Development build" --notes-file notes.md --prerelease --latest=false
            fi
          else
            printf 'Cue %s. Compiler and Luau runtime.\n' "$TAG" > notes.md
            args=(--verify-tag --title "Cue $TAG" --notes-file notes.md)
            if [ "$PRERELEASE" = true ]; then args+=(--prerelease --latest=false); fi
            gh release create "$TAG" dist/* "${args[@]}"
          fi
